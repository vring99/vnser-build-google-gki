name: 内核构建 - Android 17 (6.18)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      bakasu_version:
        description: "BakaSU Pro version"
        required: false
        type: choice
        options:
          - "35268"
        default: "35268"
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (留空=当前UTC)"
        required: false
        type: string
      use_uni:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: true
      cancel_susfs:
        description: "禁用 SUSFS（官方 6.18 支持尚未发布，保持勾选）"
        required: false
        type: boolean
        default: true
      onlyAk3:
        description: "只打包 AK3（关闭则另含 boot 和 boot-gz 镜像）"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      bakasu_version:
        required: false
        type: string
        default: "35268"
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
      use_uni:
        required: false
        type: boolean
        default: true
      cancel_susfs:
        required: false
        type: boolean
        default: true
      onlyAk3:
        required: false
        type: boolean
        default: false

jobs:
  build-kernel-a17-6-18:
    name: "6.18.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "20"
            os_patch_level: "2026-04"
          - sub_level: "21"
            os_patch_level: "2026-06"
          - sub_level: "32"
            os_patch_level: "2026-09"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android17"
      kernel_version: "6.18"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: "BakaSU Pro"
      ksu_branch: "Stable(标准)"
      bakasu_version: ${{ inputs.bakasu_version || '35268' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_uni: ${{ inputs.use_uni }}
      use_zram: false
      use_bbg: false
      use_kpm: false
      supp_op: false
      enable_susfs: ${{ !inputs.cancel_susfs }}
      onlyAk3: ${{ inputs.onlyAk3 }}
