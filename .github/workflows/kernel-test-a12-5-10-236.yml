name: 测试构建 - 5.10.236 (BakaSU Pro 35233)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      use_uni:
        description: "启用 Unicode 绕过修复"
        required: false
        type: boolean
        default: true

concurrency:
  group: kernel-test-a12-5-10-236-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: "5.10.236-android12-2025-05 / BakaSU Pro 35233"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      sub_level: "236"
      os_patch_level: "2025-05"
      revision: "r4"
      ksu_variant: "BakaSU Pro"
      ksu_branch: "Stable(标准)"
      bakasu_version: "35233"
      version: ""
      build_time: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram: true
      use_uni: ${{ inputs.use_uni }}
      use_bbg: true
      use_kpm: false
      supp_op: false
      enable_susfs: true
      onlyAk3: false
