# ========================================
# GKI 内核构建工作流
# ========================================
# 此工作流负责编译 Android GKI 内核，支持多种 KernelSU 变体和 SUSFS
# 通过 workflow_call 被其他工作流调用，不直接手动触发
# ========================================

name: 内核构建流程

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      # ==================== 基础配置 ====================
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string

      # ==================== KernelSU 配置 ====================
      ksu_variant:
        required: true
        type: string
      ksu_branch:
        required: true
        type: string

      # ==================== 可选配置 ====================
      version:
        required: false
        type: string
      revision:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 功能开关 ====================
      use_zram:
        required: true
        type: boolean
        default: true
      use_bbg:
        required: true
        type: boolean
        default: true
      use_kpm:
        required: true
        type: boolean
        default: true
      enable_susfs:
        required: true
        type: boolean
        default: true
      supp_op:
        required: false
        type: boolean
        default: false

      onlyAk3:
        required: true
        type: boolean
        default: false

jobs:
  build-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}-${{ inputs.ksu_variant }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    # ==================== 环境变量配置 ====================
    # ccache 配置用于加速重复编译
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      # ==================== 构建信息摘要 ====================
      # 打印当前构建的所有配置信息，方便调试和追踪
      - name: 构建信息摘要
        run: |
          echo "========================================"
          echo "       内核构建配置摘要"
          echo "========================================"
          echo "Android 版本  : ${{ inputs.android_version }}"
          echo "内核版本      : ${{ inputs.kernel_version }}"
          echo "子版本号      : ${{ inputs.sub_level }}"
          echo "补丁级别      : ${{ inputs.os_patch_level }}"
          echo "KSU 变体      : ${{ inputs.ksu_variant }}"
          echo "KSU 分支      : ${{ inputs.ksu_branch }}"
          echo "构建时间      : ${{ inputs.build_time }}"
          echo "SUSFS 状态    : ${{ inputs.enable_susfs }}"
          echo "ZRAM 增强     : ${{ inputs.use_zram }}"
          echo "BBG 补丁      : ${{ inputs.use_bbg }}"
          echo "KPM 功能      : ${{ inputs.use_kpm }}"
          echo "Stock Config  : 自动检测 config/stock_defconfig"
          echo "========================================"

      # ==================== 清理磁盘空间 ====================
      # GitHub Actions 默认磁盘空间有限，需要清理不必要的预装软件
      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      # ==================== 检出仓库代码 ====================
      - name: 检出代码仓库
        uses: actions/checkout@v6

      # ==================== 初始化构建环境 ====================
      # 设置各种路径变量，包括内核源码、补丁、工具等目录
      - name: 初始化构建环境
        run: |
          # 构建配置标识
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          # 导出环境变量到后续步骤
          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
          SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
          KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
          SUKISU_PATCHES=$GITHUB_WORKSPACE/SukiSU_patch
          ZZH_PATCHES=$GITHUB_WORKSPACE
          ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
          ACTION_BUILD=$GITHUB_WORKSPACE/Action-Build
          AVBTOOL=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/bin/avbtool
          MKBOOTIMG=$GITHUB_WORKSPACE/mkbootimg/mkbootimg.py
          UNPACK_BOOTIMG=$GITHUB_WORKSPACE/mkbootimg/unpack_bootimg.py
          BOOT_SIGN_KEY_PATH=$GITHUB_WORKSPACE/kernel-build-tools/linux-x86/share/avb/testkey_rsa2048.pem
          EOF

          # 下载并配置 repo 工具 (用于同步 Android 内核源码)
          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      # ==================== 显示配置文件内容 ====================
      - name: 显示配置信息
        run: |
          CONFIG_FILE="$GITHUB_WORKSPACE/config/config"
          if [ -f "$CONFIG_FILE" ]; then
            echo "加载配置文件: $CONFIG_FILE"
            cat "$CONFIG_FILE"
          fi

      # ==================== 安装编译依赖 ====================
      # 安装内核编译所需的各种工具和库（使用 apt 缓存加速）
      - name: 安装编译依赖
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: ccache python3 git curl build-essential libssl-dev bison flex libelf-dev libdw-dev dwarves
          execute_install_scripts: true

      # ==================== 配置 ccache ====================
      # ccache 用于缓存编译结果，加速后续构建
      - name: 配置 ccache
        run: |
          mkdir -p ~/.cache/bazel
          ccache --version
          ccache --max-size=2G
          ccache --set-config=compression=true
          echo "CCACHE_DIR=$HOME/.ccache" >> $GITHUB_ENV

      # ==================== 恢复 ccache 缓存 ====================
      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}-ccache-

      # ==================== 缓存工具链 ====================
      # 缓存 AOSP 构建工具，避免每次重新下载
      - name: 缓存工具链
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: |
            kernel-build-tools
            mkbootimg
          key: toolchain-${{ runner.os }}-v1

      # ==================== 下载工具链 ====================
      # 从 AOSP 镜像下载内核构建工具和 mkbootimg
      - name: 下载工具链
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          AOSP_MIRROR=https://android.googlesource.com
          BRANCH=main-kernel-build-2024
          git clone $AOSP_MIRROR/kernel/prebuilts/build-tools -b $BRANCH --depth 1 kernel-build-tools
          git clone $AOSP_MIRROR/platform/system/tools/mkbootimg -b $BRANCH --depth 1 mkbootimg

      # ==================== 生成签名密钥 ====================
      # 生成用于 boot.img 签名的 RSA 密钥
      - name: 生成签名密钥
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 > $BOOT_SIGN_KEY_PATH

      # ==================== 配置 Git ====================
      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      # ==================== 克隆依赖仓库 ====================
      # 克隆 AnyKernel3、SUSFS、各种补丁仓库
      - name: 克隆依赖仓库
        run: |
          ANYKERNEL_BRANCH="gki-2.0"
          SUSFS_BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"

          echo "克隆 AnyKernel3..."
          git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
          rm -rf AnyKernel3/.git

          echo "克隆 SUSFS (分支: $SUSFS_BRANCH)..."
          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ]; then
            if ! git clone https://github.com/ShirkNeko/susfs4ksu.git -b "$SUSFS_BRANCH" 2>/dev/null; then
              echo "ShirkNeko 仓库未找到分支 $SUSFS_BRANCH，回退到 simonpunk 原版..."
              git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
            fi
          elif [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ]; then
            # ReSukiSU 使用 simonpunk 的原版 SUSFS
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          else
            # 其他变体使用 simonpunk 的原版 SUSFS
            git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"
          fi

          # 检查是否启用自定义提交
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ]; then
              CUSTOM_COMMIT=$(grep "^${SUSFS_BRANCH}=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$CUSTOM_COMMIT" ]; then
                echo "切换 SUSFS 到自定义提交: $CUSTOM_COMMIT"
                cd susfs4ksu
                git checkout "$CUSTOM_COMMIT"
                cd ..
              fi
            fi
          fi

          SUSFS_LATEST_COMMIT_DATE=$(git -C susfs4ksu log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
          echo "SUSFS_LATEST_COMMIT_DATE=$SUSFS_LATEST_COMMIT_DATE" >> $GITHUB_ENV
          echo "SUSFS 仓库最新提交日期: $SUSFS_LATEST_COMMIT_DATE"

          echo "准备补丁资源..."
          git clone https://github.com/WildKernels/kernel_patches.git
          git clone https://github.com/ShirkNeko/SukiSU_patch.git
          echo "使用当前仓库补丁目录: $ZZH_PATCHES"
          git clone https://github.com/Numbersf/Action-Build.git --depth=1

      # ==================== 初始化并同步内核源码 ====================
      # 使用 repo 工具从 AOSP 获取 GKI 内核源码
      - name: 初始化并同步内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          KERNEL_SOURCE_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "下载 6.12 common 源码: android.googlesource.com/kernel/common.git ${KERNEL_SOURCE_BRANCH}..."
          echo "https://android.googlesource.com/kernel/common.git/+archive/refs/heads/${KERNEL_SOURCE_BRANCH}.tar.gz"
          rm -rf common common.tar.gz
          curl -L "https://android.googlesource.com/kernel/common.git/+archive/refs/heads/${KERNEL_SOURCE_BRANCH}.tar.gz" -o common.tar.gz
          mkdir -p common
          tar -xzf common.tar.gz -C common
          rm -f common.tar.gz
          git -C common log -1 --oneline || true

          echo "下载 6.12 make 编译工具链..."
          rm -rf clang19 rust build-tools clang.zip rust.zip build-tools.zip
          mkdir -p clang19 rust
          curl -L https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/clang-r536225.zip -o clang.zip
          unzip -q clang.zip -d clang19
          curl -L https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/rust.zip -o rust.zip
          unzip -q rust.zip -d rust
          curl -L https://github.com/cctv18/oneplus_sm8650_toolchain/releases/download/LLVM-Clang19-r536225/build-tools.zip -o build-tools.zip
          unzip -q build-tools.zip
          rm -f clang.zip rust.zip build-tools.zip
          
          KERNEL_REPOS=""
          KERNEL_REPOS_PATH=$(find . -type f -name "build.config.msm.common" | head -n 1)
          if [[ -n "$KERNEL_REPOS_PATH" ]]; then
            KERNEL_REPOS=$(echo "${KERNEL_REPOS_PATH#./}" | cut -d/ -f2)
            echo "✅ 发现 build.config.msm.common: $KERNEL_REPOS_PATH"
            echo "✅ KERNEL_REPOS=$KERNEL_REPOS"
            echo "KERNEL_REPOS=$KERNEL_REPOS" >> "$GITHUB_ENV"
          else
            echo "❎ 未找到 build.config.msm.common，可能是天玑清单或纯 Kleaf 构建结构"
          fi


      # ==================== 伪装 /proc/config.gz（自动检测） ====================
      # 若仓库存在 config/stock_defconfig，则自动应用；不存在则跳过
      - name: 应用 Stock Config 伪装
        run: |
          # 仓库内的 stock_defconfig 来源与内核源码目标路径
          STOCK_SRC="$GITHUB_WORKSPACE/config/stock_defconfig"
          STOCK_DST="$KERNEL_ROOT/common/arch/arm64/configs/stock_defconfig"

          # 未提供 stock_defconfig 时直接跳过，不影响主流程
          if [ ! -f "$STOCK_SRC" ]; then
            echo "未检测到 $STOCK_SRC，跳过 Stock Config 伪装。"
            exit 0
          fi

          # 提前确保目标目录存在，避免 cp 因目录缺失失败
          mkdir -p "$(dirname "$STOCK_DST")"
          if ! cp "$STOCK_SRC" "$STOCK_DST"; then
            echo "::error::复制 stock_defconfig 失败: $STOCK_SRC -> $STOCK_DST"
            exit 1
          fi
          echo "已复制 stock_defconfig -> $STOCK_DST"

          # 规则替换目标：固定为 common/kernel/Makefile（与当前目录结构一致）
          NEW_RULE='$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE'
          OLD_RULE='$(obj)/config_data: $(KCONFIG_CONFIG) FORCE'
          TARGET_MAKEFILE="$KERNEL_ROOT/common/kernel/Makefile"

          # 未找到目标 Makefile 直接失败，防止误改其它文件
          if [ ! -f "$TARGET_MAKEFILE" ]; then
            echo "::error::未找到 $TARGET_MAKEFILE"
            exit 1
          fi

          # 仅允许两种状态：已是新规则 / 命中旧规则并替换；其它情况一律报错
          if grep -qF "$NEW_RULE" "$TARGET_MAKEFILE"; then
            echo "config_data 规则已是 stock_defconfig，跳过。"
          elif grep -qF "$OLD_RULE" "$TARGET_MAKEFILE"; then
            sed -i 's|$(obj)/config_data: $(KCONFIG_CONFIG) FORCE|$(obj)/config_data: arch/arm64/configs/stock_defconfig FORCE|' "$TARGET_MAKEFILE"
            echo "已替换 config_data 规则: $TARGET_MAKEFILE"
          else
            echo "::error::未在 $TARGET_MAKEFILE 找到规则: $OLD_RULE"
            exit 1
          fi

      # ==================== 提取实际子版本号 ====================
      # 从 Makefile 中读取真实的 SUBLEVEL 值
      - name: 提取实际子版本号
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          echo "实际子版本号: $ACTUAL_SUBLEVEL"

      # ==================== 修复 glibc 2.38 兼容性问题 ====================
      # 某些旧版内核在新版 glibc 上编译会出错，需要打补丁
      - name: 修复 glibc 2.38 兼容性
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          RAW_SUB="${{ inputs.sub_level }}"
          [[ ! "$RAW_SUB" =~ ^[0-9]+$ ]] && CURRENT_SUB=99999 || CURRENT_SUB=$RAW_SUB

          NEEDS_FIX=false
          if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.10" && $CURRENT_SUB -le 186 ]] ||
             [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" && $CURRENT_SUB -le 119 ]] ||
             [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" && $CURRENT_SUB -le 43 ]]; then
            NEEDS_FIX=true
          fi

          if [ "$NEEDS_FIX" = true ]; then
            GLIBC_VERSION=$(ldd --version 2>/dev/null | head -n 1 | awk '{print $NF}')
            if [ "$(printf '%s\n' "2.38" "$GLIBC_VERSION" | sort -V | head -n1)" = "2.38" ]; then
              echo "应用 glibc 2.38 兼容性修复..."
              sed -i '/\$(Q)\$(MAKE) -C \$(SUBCMD_SRC) OUTPUT=\$(abspath \$(dir \$@))\/ \$(abspath \$@)/s//$(Q)$(MAKE) -C $(SUBCMD_SRC) EXTRA_CFLAGS="$(CFLAGS)" OUTPUT=$(abspath $(dir $@))\/ $(abspath $@)/' tools/bpf/resolve_btfids/Makefile 2>/dev/null || true

              if [[ "${{ inputs.kernel_version }}" == "5.10" || "${{ inputs.kernel_version }}" == "5.15" ]]; then
                sed -i '/char \*buf = NULL;/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++) {/for (i = 0; subcommands[i]; i++) {/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i '/if (subcommands) {/a int i;' tools/lib/subcmd/parse-options.c 2>/dev/null || true
                sed -i 's/for (int i = 0; subcommands\[i\]; i++)/for (i = 0; subcommands[i]; i++)/' tools/lib/subcmd/parse-options.c 2>/dev/null || true
              fi
            fi
          fi

      # ==================== 一加 8E 处理器支持 ====================
      # 添加一加 8E 处理器机型的支持补丁
      - name: 添加一加 8E 处理器支持
        if: inputs.supp_op
        working-directory: ${{ env.KERNEL_ROOT }}/common/drivers
        run: |
          echo "下载一加 8E 支持补丁..."
          curl -LSs "https://github.com/zzh20188/GKI_KernelSU_SUSFS/raw/refs/heads/dev/hmbird_patch.c" -o hmbird_patch.c
          echo "obj-y += hmbird_patch.o" >> Makefile

      # ==================== 确定 KernelSU 分支 ====================
      # 根据用户选择的变体和分支，确定实际使用的 Git 分支
      - name: 确定 KernelSU 分支
        id: ksu-branch
        run: |
          branch_input="${{ inputs.ksu_branch }}"
          variant_input="${{ inputs.ksu_variant }}"

          case "$branch_input" in
            "Stable(标准)")
              case "$variant_input" in
                "Next") BRANCH="-s stable" ;;
                "SukiSU") BRANCH="-s main" ;;
                "ReSukiSU") BRANCH="-s 3f9c42e8" ;;
                "Official"|"MKSU") BRANCH="-s main" ;;
                *) BRANCH="-" ;;
              esac
              ;;
            "Dev(开发)")
              case "$variant_input" in
                "Official"|"MKSU") BRANCH="-s main" ;;
                "Next") BRANCH="-s dev" ;;
                "SukiSU"|"ReSukiSU") BRANCH="-s builtin" ;;
                *) echo "未知变体: $variant_input" >&2; exit 1 ;;
              esac
              ;;
            *)
              echo "未知分支: $branch_input" >&2
              exit 1
              ;;
          esac

          # SukiSU/ReSukiSU 不启用 SUSFS 时强制使用 main 分支
          if [ "$variant_input" = "SukiSU" ] || [ "$variant_input" = "ReSukiSU" ]; then
            if [ "${{ inputs.enable_susfs }}" = "false" ]; then
              BRANCH="-s main"
            fi
          fi

          # 检查是否启用自定义提交 (仅对 SukiSU 生效)
          CONFIG_FILE="config/config"
          if [ -f "$CONFIG_FILE" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" "$CONFIG_FILE" | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" == "true" ] && [ "$variant_input" == "SukiSU" ]; then
              SUKISU_COMMIT=$(grep "^sukisu=" "$CONFIG_FILE" | cut -d'=' -f2)
              if [ -n "$SUKISU_COMMIT" ]; then
                BRANCH="-s $SUKISU_COMMIT"
                echo "SukiSU 使用自定义提交: $SUKISU_COMMIT"
              fi
            fi
          fi

          echo "BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "KSU 分支: $BRANCH"

      - name: 备份原始 defconfig
        run: cp "$DEFCONFIG" "$DEFCONFIG.orig"

      # ==================== 添加 KernelSU ====================
      # 根据选择的变体添加对应的 KernelSU
      - name: 添加 KernelSU
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          case "${{ inputs.ksu_variant }}" in
            "Official")
              echo "添加 KernelSU 官方版..."
              curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s f9c7823

              # 计算并设置 KSU 版本号
              cd KernelSU
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
              KSU_VERSION=$((20000 + KSU_GIT_VERSION))
              echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
              echo "计算的 KSU 版本号: $KSU_VERSION"

              # 更新 Kbuild 中的版本号
              if [ -f "kernel/Kbuild" ]; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
                echo "已更新 kernel/Kbuild 中的版本号"
              fi
              cd ..
              ;;
            "Next")
              echo "添加 KernelSU-Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/refs/heads/dev/kernel/setup.sh" | bash -s dev_susfs
              ;;
            "MKSU")
              echo "添加 MKSU..."
              curl -LSs "https://raw.githubusercontent.com/5ec1cff/KernelSU/main/kernel/setup.sh" | bash $BRANCH

              # 计算并设置 KSU 版本号
              cd KernelSU
              KSU_GIT_VERSION=$(git rev-list --count HEAD)
              KSU_VERSION=$((20000 + KSU_GIT_VERSION))
              echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
              echo "计算的 KSU 版本号: $KSU_VERSION"

              # 更新 Kbuild 中的版本号
              if [ -f "kernel/Kbuild" ]; then
                sed -i "s/DKSU_VERSION=16/DKSU_VERSION=${KSU_VERSION}/" kernel/Kbuild
                echo "已更新 kernel/Kbuild 中的版本号"
              fi
              cd ..
              ;;
            "SukiSU")
              echo "添加 SukiSU..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash $BRANCH
              ;;
            "ReSukiSU")
              echo "添加 ReSukiSU..."
              curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash $BRANCH
              echo 'CONFIG_KSU_FULL_NAME_FORMAT="%TAG_NAME%-%COMMIT_SHA%@vring"' >> ./common/arch/arm64/configs/gki_defconfig
              cd ./KernelSU
              # 生成自定义版本号（基于提交计数）, 失败时使用 114514
              KSU_VERSION=$(expr $(git rev-list --count 3f9c42e8) + 30700 2>/dev/null || echo 114514)
              cd ../
              # 存储版本号到 GitHub 环境变量
              echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV
              echo "ksuver=$KSU_VERSION" >> $GITHUB_OUTPUT
          
              ;;
          esac

          if [ -d "KernelSU/.git" ]; then
            KSU_LATEST_COMMIT_DATE=$(git -C KernelSU log -1 --date=format:'%Y-%m-%d %H:%M:%S %z' --format='%cd')
            echo "KSU_LATEST_COMMIT_DATE=$KSU_LATEST_COMMIT_DATE" >> $GITHUB_ENV
            echo "KSU 仓库最新提交日期: $KSU_LATEST_COMMIT_DATE"
          else
            echo "KSU_LATEST_COMMIT_DATE=未知" >> $GITHUB_ENV
          fi

      # ==================== 配置 SukiSU 管理器信息 ====================
      - name: 配置 SukiSU 管理器信息
        if: inputs.ksu_variant == 'SukiSU'
        working-directory: ${{ env.KERNEL_ROOT }}/KernelSU
        run: |
          KBUILD_FILE="./kernel/Kbuild"
          CUSTOM_TAG="${{ vars.MANAGER_STR }}"

          if [ ! -f "$KBUILD_FILE" ]; then
            echo "未找到 $KBUILD_FILE，跳过 SukiSU 版本标识定制"
            exit 0
          fi

          GIT_HASH=$(git rev-parse --short=8 HEAD)
          BRANCH_NAME="${BRANCH#-s }"
          if [ -z "$BRANCH_NAME" ] || [ "$BRANCH_NAME" = "$BRANCH" ]; then
            BRANCH_NAME=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "main")
          fi

          if [ -n "$CUSTOM_TAG" ]; then
            VERSION_TEMPLATE="v\$1-$CUSTOM_TAG@$BRANCH_NAME[$GIT_HASH]"
          else
            VERSION_TEMPLATE="v\$1-$GIT_HASH@$BRANCH_NAME"
          fi

          awk -v body="$VERSION_TEMPLATE" '
            BEGIN {
              in_block = 0
              replaced = 0
            }
            /^[[:space:]]*define get_ksu_version_full$/ {
              print
              print body
              in_block = 1
              replaced = 1
              next
            }
            in_block && /^[[:space:]]*endef$/ {
              print
              in_block = 0
              next
            }
            !in_block {
              print
            }
            END {
              if (!replaced) {
                exit 1
              }
            }
          ' "$KBUILD_FILE" > "${KBUILD_FILE}.tmp" && mv "${KBUILD_FILE}.tmp" "$KBUILD_FILE"

          echo "已更新 get_ksu_version_full 模板: $VERSION_TEMPLATE"

      - name: 应用 SUSFS 补丁
        if: inputs.enable_susfs
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          echo "应用 SUSFS 补丁..."
          SUSFS_VERSION="2.0.0"

          # 复制 SUSFS 基础文件
          cp $SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch ./common/
          cp $SUSFS4KSU/kernel_patches/fs/* ./common/fs/
          cp $SUSFS4KSU/kernel_patches/include/linux/* ./common/include/linux/

          case "${{ inputs.ksu_variant }}" in
            "Official"|"MKSU")
              cd ./KernelSU
              cp $SUSFS4KSU/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch ./

              # 修复补丁格式（Makefile → Kbuild）
              sed -i 's|kernel/Makefile|kernel/Kbuild|g' ./10_enable_susfs_for_ksu.patch

              # 修复补丁上下文行数
              sed -i 's|^@@ .* format:.*|@@ -94,4 +94,13 @@|' ./10_enable_susfs_for_ksu.patch

              # 修复编译警告配置
              sed -i 's|.*check-format:.*| ccflags-y += -Wno-strict-prototypes -Wno-int-conversion -Wno-gcc-compat -Wno-missing-prototypes|' ./10_enable_susfs_for_ksu.patch
              sed -i 's|.*clang-format --dry-run.*| ccflags-y += -Wno-declaration-after-statement -Wno-unused-function -Wno-unused-variable|' ./10_enable_susfs_for_ksu.patch

              # 应用补丁
              patch -p1 < 10_enable_susfs_for_ksu.patch || true
              cd ..
              ;;
            "Next"|"SukiSU"|"ReSukiSU")
              echo "Next/SukiSU/ReSukiSU 使用内置 SUSFS 支持"
              ;;
          esac

          # 应用主 SUSFS 补丁到内核
          cd $KERNEL_ROOT/common
          patch -p1 < 50_add_susfs_in_gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}.patch || true

          # 应用版本特定修复 (所有 KSU 变体)
          if [ "${{ inputs.ksu_variant }}" == "Official" ] || [ "${{ inputs.ksu_variant }}" == "MKSU" ] || [ "${{ inputs.ksu_variant }}" == "Next" ] || [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ]; then
            CURRENT_SUB="${{ inputs.sub_level }}"
            if [[ ! "$CURRENT_SUB" =~ ^[0-9]+$ ]]; then
              CURRENT_SUB=99999
            fi

             # Android 12 - 5.10 修复
            if [[ "${{ inputs.android_version }}" == "android12" && "${{ inputs.kernel_version }}" == "5.10" ]]; then
              # 修复 2024-11 分支: mmap.c 调用了 vm_flags_clear()，但同分支 mm.h 未提供 helper
              if [[ "${{ inputs.os_patch_level }}" == "2024-11" ]] && grep -qF 'vm_flags_clear(new_vma, VM_PAD_MASK);' ./mm/mmap.c; then
                sed -i 's/vm_flags_clear(new_vma, VM_PAD_MASK);/new_vma->vm_flags \&= ~VM_PAD_MASK;/' ./mm/mmap.c
              fi
              if [[ "$CURRENT_SUB" -le 209 ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
              if [[ "$CURRENT_SUB" -le 117 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a12-5.10/fdinfo.c.patch ./
                patch -p1 < fdinfo.c.patch || true
              fi
              if [[ "$CURRENT_SUB" -le 43 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a12-5.10/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi
            fi

            # Android 13 - 5.15 修复
            if [[ "${{ inputs.android_version }}" == "android13" && "${{ inputs.kernel_version }}" == "5.15" ]]; then
              # 修复 2024-11 分支: mmap.c 调用了 vm_flags_clear()，但同分支 mm.h 未提供 helper
              if [[ "${{ inputs.os_patch_level }}" == "2024-11" ]] && grep -qF 'vm_flags_clear(new_vma, VM_PAD_MASK);' ./mm/mmap.c; then
                sed -i 's/vm_flags_clear(new_vma, VM_PAD_MASK);/new_vma->vm_flags \&= ~VM_PAD_MASK;/' ./mm/mmap.c
              fi
              if [[ "$CURRENT_SUB" -le 41 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a13-5.15/namespace.c.patch ./
                patch -p1 < namespace.c.patch || true
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a13-5.15/fdinfo.c.patch ./
                patch -p1 < fdinfo.c.patch || true
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a13-5.15/open.c.patch ./
                patch -p1 < open.c.patch || true
              fi
              # 修复 5.15.197~5.15.206: SUSFS 补丁在 namespace.c 头部 hunk 失配，
              # 导致 DEFAULT_KSU_MNT_ID / CL_COPY_MNT_NS 等符号未声明
              if [[ "$CURRENT_SUB" -ge 197 && "$CURRENT_SUB" -le 206 ]] && grep -q 'DEFAULT_KSU_MNT_ID\|VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT\|susfs_is_current_ksu_domain\|CL_COPY_MNT_NS' ./fs/namespace.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/namespace.c; then
                echo "检测到 5.15 namespace.c 缺少 susfs_def.h，注入声明..."
                if grep -qF '#include <linux/mnt_idmapping.h>' ./fs/namespace.c; then
                  sed -i '/#include <linux\/mnt_idmapping.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif' ./fs/namespace.c
                else
                  sed -i '/#include "internal.h"/i #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif\n' ./fs/namespace.c
                fi
                if ! grep -q 'extern bool susfs_is_current_ksu_domain' ./fs/namespace.c; then
                  sed -i '/#include "internal.h"/a \\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n\n#endif' ./fs/namespace.c
                fi
              fi
              if [[ "$CURRENT_SUB" -le 148 && "${{ inputs.os_patch_level }}" != "2024-05" ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
            fi

            # Android 14 - 6.1 修复
            if [[ "${{ inputs.android_version }}" == "android14" && "${{ inputs.kernel_version }}" == "6.1" ]]; then
              if [[ "$CURRENT_SUB" -le 141 || "$CURRENT_SUB" -ge 145 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a14-6.1/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi
              if grep -q 'susfs_is_current_proc_umounted\|SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/proc/base.c; then
                if grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                  sed -i '/#include <linux\/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/base.c
                else
                  sed -i '/#include <linux\/cpufreq_times.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux\/susfs_def.h>\n#endif' ./fs/proc/base.c
                fi
              fi
              if [[ "$CURRENT_SUB" -le 75 && "${{ inputs.os_patch_level }}" != "2024-05" ]]; then
                sed -i -e 's/goto show_pad;/return 0;/' ./fs/proc/task_mmu.c
              fi
              # 修复 6.1 LTS: SUSFS 补丁在 namespace.c 头部 hunk 因上下文不匹配而失败，
              # 导致函数体中的 SUSFS 符号（DEFAULT_KSU_MNT_ID 等）未声明
              if grep -q 'DEFAULT_KSU_MNT_ID\|susfs_mnt_id_ida' ./fs/namespace.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/namespace.c; then
                echo "检测到 namespace.c 缺少 susfs_def.h，注入声明..."
                sed -i '/#include <linux\/mnt_idmapping.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif' ./fs/namespace.c
                if ! grep -q 'extern bool susfs_is_current_ksu_domain' ./fs/namespace.c; then
                  sed -i '/#include "internal.h"/a \\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n\n#endif' ./fs/namespace.c
                fi
              fi
            fi

            # Android 15 - 6.6 修复
            if [[ "${{ inputs.android_version }}" == "android15" && "${{ inputs.kernel_version }}" == "6.6" ]]; then
              if [[ "$CURRENT_SUB" -ge 98 ]]; then
                cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a15-6.6/base.c.patch ./
                patch -p1 < base.c.patch || true
              fi

              # 修复 6.6 LTS: SUSFS 补丁在 namespace.c 头部 hunk 失配，
              # 导致 DEFAULT_KSU_MNT_ID / CL_COPY_MNT_NS 等符号未声明
              if [[ "$CURRENT_SUB" -le 46 ]] && grep -q 'DEFAULT_KSU_MNT_ID\|VFSMOUNT_MNT_FLAGS_KSU_UNSHARED_MNT\|susfs_is_current_ksu_domain\|CL_COPY_MNT_NS' ./fs/namespace.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/namespace.c; then
                echo "检测到 6.6 namespace.c 缺少 susfs_def.h，注入声明..."
                if grep -qF '#include <linux/mnt_idmapping.h>' ./fs/namespace.c; then
                  sed -i '/#include <linux\/mnt_idmapping.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif' ./fs/namespace.c
                else
                  sed -i '/#include "internal.h"/i #ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\n#include <linux\/susfs_def.h>\n#endif\n' ./fs/namespace.c
                fi
                if ! grep -q 'extern bool susfs_is_current_ksu_domain' ./fs/namespace.c; then
                  sed -i '/#include "internal.h"/a \\n#ifdef CONFIG_KSU_SUSFS_SUS_MOUNT\nextern bool susfs_is_current_ksu_domain(void);\nextern struct static_key_true susfs_is_sdcard_android_data_not_decrypted;\n\n#define CL_COPY_MNT_NS BIT(25)\n\n#endif' ./fs/namespace.c
                fi
              fi
          
              # 修复 6.6.50~6.6.97: 缺少 susfs_def.h 导致编译报 undeclared identifier
              if grep -q 'AS_FLAGS_SUS_MAP\|susfs_is_current_proc_umounted' ./fs/proc/base.c && ! grep -qF 'susfs_def.h' ./fs/proc/base.c; then
                if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                  sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
                fi
                sed -i '/#include <linux\/dma-buf.h>/a #endif' ./fs/proc/base.c
                sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs_def.h>' ./fs/proc/base.c
                sed -i '/#include <linux\/dma-buf.h>/a #ifdef CONFIG_KSU_SUSFS_SUS_MAP' ./fs/proc/base.c
              fi
              # 修复 ReSukiSU: 缺少 susfs.h 导致编译报 undeclared identifier
              if grep -q 'SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF '#include <linux/susfs.h>' ./fs/proc/base.c; then
                if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
                  sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
                fi
                sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs.h>' ./fs/proc/base.c
              fi
          
              # 修复 6.6.50~6.6.97: fs/proc/base.c 头部 hunk 失配，导致 susfs_def.h 漏打
              #if grep -q 'AS_FLAGS_SUS_MAP\|susfs_is_current_proc_umounted\|SUSFS_IS_INODE_SUS_MAP\|SUSFS_IS_INODE_OPEN_REDIRECT' ./fs/proc/base.c && ! grep -qF 'susfs_def.h' ./fs/proc/base.c; then
              #  if ! grep -qF '#include <linux/dma-buf.h>' ./fs/proc/base.c; then
              #    sed -i '/#include <linux\/cpufreq_times.h>/a #include <linux\/dma-buf.h>' ./fs/proc/base.c
              #  fi
              #  sed -i '/#include <linux\/dma-buf.h>/a #endif' ./fs/proc/base.c
              #  sed -i '/#include <linux\/dma-buf.h>/a #include <linux\/susfs_def.h>' ./fs/proc/base.c
              #  sed -i '/#include <linux\/dma-buf.h>/a #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)' ./fs/proc/base.c
              #fi
          
              if [[ "$CURRENT_SUB" -le 58 ]]; then
                #cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a15-6.6/task_mmu.c.patch ./
                #patch -p1 < task_mmu.c.patch || true
                # memory.c
                sed -i '/#include <linux\/sched\/sysctl.h>/a \
                #ifdef CONFIG_KSU_SUSFS_SUS_MAP\n#include <linux/susfs_def.h>\n#endif' mm/memory.c
  
                # fs/proc/base.c
                sed -i '/#include <linux\/dma-buf.h>/a \
                #if defined(CONFIG_KSU_SUSFS_SUS_MAP) || defined(CONFIG_KSU_SUSFS_OPEN_REDIRECT)\n#include <linux/susfs_def.h>\n#endif' fs/proc/base.c
              fi
            fi

            # Android 16 - 6.12 修复
            if [[ "${{ inputs.android_version }}" == "android16" && "${{ inputs.kernel_version }}" == "6.12" ]]; then
              # 修复 setuid_hook.c 重复定义
              SETUID_HOOK="$KERNEL_ROOT/common/drivers/kernelsu/setuid_hook.c"
              if [ -f "$SETUID_HOOK" ]; then
                sed -i 's/defined(CONFIG_KSU_MANUAL_HOOK))/!defined(CONFIG_KSU_SUSFS) \&\& defined(CONFIG_KSU_MANUAL_HOOK))/' "$SETUID_HOOK"
                echo "已修复 setuid_hook.c 重复定义问题"
              fi

              # 修复 6.12.58+: exec.c 头部上下文变化导致 SUSFS 补丁漏掉 susfs_def.h
              if grep -q 'susfs_is_current_proc_umounted' ./fs/exec.c && ! grep -qF '#include <linux/susfs_def.h>' ./fs/exec.c; then
                if grep -qF '#include <linux/dma-buf.h>' ./fs/exec.c; then
                  sed -i '/#include <linux\/dma-buf.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' ./fs/exec.c
                else
                  sed -i '/#include <linux\/ksm.h>/a #ifdef CONFIG_KSU_SUSFS\n#include <linux\/susfs_def.h>\n#endif' ./fs/exec.c
                fi
                echo "已修复 exec.c 缺少 susfs_def.h 问题"
              fi
            fi
          fi

      # ==================== Unicode 绕过修复 ====================
      # 修复 Unicode 零宽字符绕过检测的问题
      - name: 应用 Unicode 绕过修复
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          if [ "${{ inputs.kernel_version }}" = "5.10" ] || [ "${{ inputs.kernel_version }}" = "5.15" ]; then
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1-.patch" || true
          else
            patch -p1 --forward < "$ACTION_BUILD/patches/unicode_bypass_fix_6.1+.patch" || true
          fi

      #- name: 应用 SELinux 策略/上下文查询隐藏补丁
       # working-directory: ${{ env.KERNEL_ROOT }}/common
      #  run: |
      #    echo "正在应用 SELinux 策略/上下文查询隐藏补丁..."
      #    wget https://github.com/$GITHUB_REPOSITORY/raw/refs/heads/$GITHUB_REF_NAME/other_patch/70_selinux_hide_policy_query.patch -O 70_selinux_hide_policy_query.patch
      #    patch -p1 -N -F 3 < 70_selinux_hide_policy_query.patch || true
          

      # ==================== 升级 LZ4 并应用 LZ4KD/LZ4K_OPLUS 补丁 ====================
      # 统一处理 ZRAM 相关的 LZ4 变更，减少重复 step
      - name: 配置 ZRAM LZ4 补丁栈
        if: inputs.use_zram
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 第一阶段：升级 LZ4 到 1.10.0
          echo "升级 LZ4..."
          rm -f lib/lz4/lz4_compress.c lib/lz4/lz4_decompress.c lib/lz4/lz4defs.h lib/lz4/lz4hc_compress.c

          cp -r $ZZH_PATCHES/zram/lz4/* ./lib/lz4/
          cp -r $ZZH_PATCHES/zram/include/linux/* ./include/linux/
          bash $ZZH_PATCHES/zram/apply_lz4_neon.sh

          if [ -f "fs/f2fs/Makefile" ] && ! grep -qF "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" "fs/f2fs/Makefile"; then
            echo "f2fs-\$(CONFIG_F2FS_IOSTAT) += iostat.o" >> "fs/f2fs/Makefile"
          fi

          # 第二阶段：应用 LZ4KD 和 LZ4K_OPLUS 补丁
          cp -r $SUKISU_PATCHES/other/zram/lz4k/include/linux/* ./include/linux/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/lib/* ./lib/
          cp -r $SUKISU_PATCHES/other/zram/lz4k/crypto/* ./crypto/
          cp -r $SUKISU_PATCHES/other/zram/lz4k_oplus ./lib/

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4kd.patch ./
          if ! patch -p1 -F 3 < lz4kd.patch; then
            echo "::warning::lz4kd.patch 应用失败，可能已应用或上下文不匹配"
          fi

          cp $SUKISU_PATCHES/other/zram/zram_patch/${{ inputs.kernel_version }}/lz4k_oplus.patch ./
          if ! patch -p1 -F 3 < lz4k_oplus.patch; then
            echo "::warning::lz4k_oplus.patch 应用失败，可能已应用或上下文不匹配"
          fi

      # ==================== 修复 6.6 WiFi/蓝牙兼容性（三星 + 小米） ====================
      # 合并三星与小米修复，并采用幂等写法避免重复追加导致脏变更
      - name: 修复 6.6 WiFi/蓝牙兼容性（三星 + 小米）
        if: inputs.kernel_version == '6.6'
        working-directory: ${{ env.KERNEL_ROOT }}/common
        run: |
          # 仅在行不存在时追加，避免重复执行污染文件
          ensure_line_once() {
            local file="$1"
            local line="$2"
            if [ ! -f "$file" ]; then
              echo "::error::文件不存在: $file"
              exit 1
            fi
            if ! grep -qF "$line" "$file"; then
              echo "$line" >> "$file"
            fi
          }

          GALAXY_SYMBOL_LIST="android/abi_gki_aarch64_galaxy"
          XIAOMI_SYMBOL_LIST="android/abi_gki_aarch64_xiaomi"
          DRIVERS_MAKEFILE="drivers/Makefile"
          MIN_KDP_SRC="$KERNEL_PATCHES/samsung/min_kdp/min_kdp.c"
          MIN_KDP_PATCH="$KERNEL_PATCHES/samsung/min_kdp/add-min_kdp-symbols.patch"
          MIN_KDP_DST="drivers/min_kdp.c"

          # 三星：补充 KDP 符号（幂等）
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_set_cred_non_rcu"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_dec_and_test"
          ensure_line_once "$GALAXY_SYMBOL_LIST" "kdp_usecount_inc"

          # 三星：仅在可应用时打补丁，已应用/不匹配则跳过
          if [ ! -f "$MIN_KDP_PATCH" ]; then
            echo "::error::补丁不存在: $MIN_KDP_PATCH"
            exit 1
          fi
          if patch -p1 --dry-run < "$MIN_KDP_PATCH" >/dev/null 2>&1; then
            patch -p1 --no-backup-if-mismatch < "$MIN_KDP_PATCH"
          else
            echo "min_kdp symbols patch 已应用或当前上下文不匹配，跳过。"
          fi

          # 三星：复制驱动源码并确保 Makefile 仅追加一次
          if [ ! -f "$MIN_KDP_SRC" ]; then
            echo "::error::文件不存在: $MIN_KDP_SRC"
            exit 1
          fi
          cp "$MIN_KDP_SRC" "$MIN_KDP_DST"
          ensure_line_once "$DRIVERS_MAKEFILE" "obj-y += min_kdp.o"

          # 小米：补充符号（幂等）
          ensure_line_once "$XIAOMI_SYMBOL_LIST" "device_find_any_child"

      - name: 配置 ZRAM 选项
        if: inputs.use_zram
        run: |
          CONFIG_FILE="$DEFCONFIG"

          if [ "${{ inputs.kernel_version }}" = "5.10" ]; then
            cat >> "$CONFIG_FILE" <<'EOF'
          CONFIG_ZSMALLOC=y
          CONFIG_ZRAM=y
          CONFIG_MODULE_SIG=n
          CONFIG_CRYPTO_LZO=y
          CONFIG_ZRAM_DEF_COMP_LZ4KD=y
          EOF
          fi

          if [ "${{ inputs.kernel_version }}" != "6.6" ] && [ "${{ inputs.kernel_version }}" != "5.10" ]; then
            if grep -q "CONFIG_ZSMALLOC" "$CONFIG_FILE"; then
              sed -i 's/CONFIG_ZSMALLOC=m/CONFIG_ZSMALLOC=y/g' "$CONFIG_FILE"
            else
              echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            fi
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.kernel_version }}" = "6.6" ]; then
            echo "CONFIG_ZSMALLOC=y" >> "$CONFIG_FILE"
            sed -i 's/CONFIG_ZRAM=m/CONFIG_ZRAM=y/g' "$CONFIG_FILE"
          fi

          if [ "${{ inputs.android_version }}" = "android14" ] || [ "${{ inputs.android_version }}" = "android15" ]; then
            sed -i 's/"drivers\/block\/zram\/zram\.ko",//g; s/"mm\/zsmalloc\.ko",//g' "$KERNEL_ROOT/common/modules.bzl"
          fi

          if grep -q "CONFIG_ZSMALLOC=y" "$CONFIG_FILE" && grep -q "CONFIG_ZRAM=y" "$CONFIG_FILE"; then
            cat "$ZZH_PATCHES/config/zram.config" >> "$CONFIG_FILE"
          fi

      # ==================== 添加 BBG 防格机补丁 ====================
      # BBG (Baseband Guard) 防止基带格式化攻击
      - name: 添加 BBG 防格机补丁
        if: inputs.use_bbg
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          wget -O- https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
          echo "CONFIG_BBG=y" >> common/arch/arm64/configs/gki_defconfig
          sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

      # ==================== 配置内核选项 ====================
      # 添加 KernelSU 和其他必要的内核配置
      - name: 配置内核选项
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

          if [ "${{ inputs.ksu_variant }}" == "SukiSU" ] || [ "${{ inputs.ksu_variant }}" == "ReSukiSU" ] || [ "${{ inputs.ksu_variant }}" == "Next" ]; then
            echo "CONFIG_KPM=y" >> "$DEFCONFIG"
          fi

          sed -i 's/check_defconfig//' ./common/build.config.gki

      - name: 添加 SUSFS 配置
        if: inputs.enable_susfs
        run: |
          cat >> "$DEFCONFIG" << 'EOF'
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_MAP=y
          EOF

      # ==================== 配置内核名称 ====================
      - name: 配置内核名称
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          [ -f ./common/BUILD.bazel ] && sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' ./common/BUILD.bazel
          [ -f ./common/BUILD.bazel ] && sed -i '/kmi_symbol_list_strict_mode/d' ./common/BUILD.bazel
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i 's/-dirty//' ./common/scripts/setlocalversion

          VERSION_INPUT=$(echo "${{ inputs.version }}" | tr -d '[:space:]')
          if [ -n "$VERSION_INPUT" ]; then
            CLEAN_VERSION=$(echo "$VERSION_INPUT" | sed -E 's/^[0-9]+\.[0-9]+\.[0-9]+//')
            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${CLEAN_VERSION}"'"/s' ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i "\$s|echo \"\$res\"|echo \"${CLEAN_VERSION}\"|" ./common/scripts/setlocalversion 2>/dev/null || true
            sed -i '/^CONFIG_LOCALVERSION=/ s/="\([^"]*\)"/="'"$CLEAN_VERSION"'"/' ./common/arch/arm64/configs/gki_defconfig
          else
            cd ./common
            GHASH=$(git rev-parse --verify HEAD | cut -c1-13)
            case "${{ inputs.kernel_version }}" in
              "5.10")
                KERNEL_LOCAL="-android12-9-$(printf '%05d' $((RANDOM % 200)))-g${GHASH}-ab$((RANDOM % 90000000 + 10000000))"
                ;;
              "5.15")
                KERNEL_LOCAL="-android13-8-$(printf '%05d' $((RANDOM % 200)))-g${GHASH}-ab$((RANDOM % 90000000 + 10000000))"
                ;;
              "6.1")
                KERNEL_LOCAL="-android14-11-g${GHASH}-ab$((RANDOM % 90000000 + 10000000))"
                ;;
              "6.6")
                KERNEL_LOCAL="-android15-8-g${GHASH}-abogki$((RANDOM % 900000000 + 100000000))-4k"
                ;;
              "6.12")
                KERNEL_LOCAL="-android16-5-g${GHASH}-abogki$((RANDOM % 900000000 + 100000000))-4k"
                ;;
              *)
                KERNEL_LOCAL="-${{ inputs.android_version }}-g${GHASH}-ab$((RANDOM % 90000000 + 10000000))"
                ;;
            esac

            perl -i -0777 -pe 's/(.*)echo "\$\{KERNELVERSION\}\$\{file_localversion\}\$\{config_localversion\}\$\{LOCALVERSION\}\$\{scm_version\}"/$1echo "\$\{KERNELVERSION\}'"${KERNEL_LOCAL}"'"/s' ./scripts/setlocalversion 2>/dev/null || true
            sed -i "\$s|echo \"\$res\"|echo \"${KERNEL_LOCAL}\"|" ./scripts/setlocalversion 2>/dev/null || true
            sed -i "/^CONFIG_LOCALVERSION=/ s/=\"[^\"]*\"/=\"${KERNEL_LOCAL}\"/" ./arch/arm64/configs/gki_defconfig 2>/dev/null || true
          fi

      # ==================== 自定义构建时间 ====================
      - name: 设置自定义构建时间
        shell: bash
        run: |
          # 读取输入：输入 N/n 或留空时，使用当前 UTC 时间
          INPUT_TIME="${{ inputs.build_time }}"
          if [[ -n "$INPUT_TIME" && "$INPUT_TIME" != "N" && "$INPUT_TIME" != "n" ]]; then
            DATESTR="$INPUT_TIME"
            echo "使用输入的构建时间: $DATESTR"
          else
            DATESTR="$(TZ='UTC' date +'%a %b %d %T %Z %Y')"
            echo "使用当前 UTC 时间: $DATESTR"
          fi

          # 导出给后续编译流程
          echo "KBUILD_BUILD_TIMESTAMP=$DATESTR" >> "$GITHUB_ENV"
          echo "KBUILD_BUILD_VERSION=1" >> "$GITHUB_ENV"

          for f in $KERNEL_ROOT/common/scripts/mkcompile_h $KERNEL_REPOS/scripts/mkcompile_h; do
            if [ -f "$f" ]; then
              echo "Patching mkcompile_h with BUILD_TIME=$DATESTR"
              if grep -q 'UTS_VERSION=' "$f"; then
                perl -pi -e "s{UTS_VERSION=\"\\\$\\(.*?\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
              else
                perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
              fi
            fi
          done
          # 固定只处理 common/scripts/mkcompile_h
          #f="$KERNEL_ROOT/common/scripts/mkcompile_h"
          #if [ -f "$f" ]; then
          #  echo "写入 mkcompile_h 构建时间: $DATESTR"
          #  if grep -q 'UTS_VERSION=' "$f"; then
          #    perl -pi -e "s{UTS_VERSION=\"\\\$\\\(.*?\\\)\"}{UTS_VERSION=\"#1 SMP PREEMPT $DATESTR\"}" "$f"
          #  else
          #    perl -0777 -pi -e "s{cat <<EOF}{cat <<EOF\n#undef UTS_VERSION\n#define UTS_VERSION \"#1 SMP PREEMPT $DATESTR\" } unless /UTS_VERSION/" "$f"
          #  fi
          #else
          #  echo "未找到目标文件，跳过: $f"
          #fi

      - name: 编译内核
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_on: timeout
          command: |
            echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
            echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE}"
            set -ex
            cd "$KERNEL_ROOT"

            export PATH="$KERNEL_ROOT/clang19/bin:$PATH"
            export PATH="$KERNEL_ROOT/build-tools/bin:$PATH"
            export PATH="$KERNEL_ROOT/rust/bin:$PATH"
            export RUSTC="rustc"
            export BINDGEN="bindgen"
            export LIBCLANG_PATH="$KERNEL_ROOT/clang19/lib"
            export LLVM=1 LLVM_IAS=1
            export ARCH=arm64 SUBARCH=arm64
            export CROSS_COMPILE=aarch64-linux-gnu-
            export CC="clang"
            export HOSTCC="clang"
            export LD="ld.lld"
            export HOSTLD="ld.lld"
            export AR="llvm-ar"
            export NM="llvm-nm"
            export AS="clang"
            export READELF="llvm-readelf"
            export OBJCOPY="llvm-objcopy"
            export OBJDUMP="llvm-objdump"
            export OBJSIZE="llvm-size"
            export STRIP="llvm-strip"
            export CCACHE_BASEDIR="$GITHUB_WORKSPACE"
            export CCACHE_NOHASHDIR="true"
            export CCACHE_NOHARDLINK="true"
            export CCACHE_COMPILERCHECK="none"

            cd common
            #KERNEL_SOURCE_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
            KERNEL_SOURCE_BRANCH="android16-6.12-2025-06"
            curl -L "https://raw.githubusercontent.com/cctv18/android_gki_kernel_common/refs/heads/android16-6.12-2025-06/_setup_env.sh" -o ./_setup_env.sh || true
            source "./_setup_env.sh" 2>/dev/null || true

            COMMON_REAL_PATH=$(pwd -P)
            ROOT_REAL_PATH=$(dirname "$COMMON_REAL_PATH")
            KCFLAGS+=" -Wno-unused-command-line-argument"
            KCFLAGS+=" -Wno-error=unused-command-line-argument"
            KCFLAGS+=" -fdebug-prefix-map=$ROOT_REAL_PATH=."
            KCFLAGS+=" -fmacro-prefix-map=$ROOT_REAL_PATH=."
            KCFLAGS+=" -ffile-prefix-map=$ROOT_REAL_PATH=."
            KCFLAGS+=" -no-canonical-prefixes"
            KCFLAGS+=" -O2"
            KCFLAGS+=" -pipe"
            KCFLAGS+=" -Wno-error"
            KCFLAGS+=" -fno-stack-protector"
            KCFLAGS+=" -D__ANDROID_COMMON_KERNEL__"
            export KCFLAGS

            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out gki_defconfig
            make -j$(nproc --all) LLVM=1 ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CC="ccache clang" LD="ld.lld" OBJCOPY="llvm-objcopy" O=out Image
            strings out/arch/arm64/boot/Image | grep 'Linux version'

            echo "当前 KSU 最新提交日期: ${KSU_LATEST_COMMIT_DATE}"
            echo "当前 SUSFS 最新提交日期: ${SUSFS_LATEST_COMMIT_DATE}"
            echo "如果日期不同或相差过远则补丁失效、编译失败"
      # ==================== KPM 补丁 (仅 SukiSU) ====================
      # 为 SukiSU 应用 KPM (Kernel Patch Module) 补丁
      - name: 应用 KPM 补丁 (SukiSU/ReSukiSU/Next)
        if: inputs.use_kpm && (inputs.ksu_variant == 'SukiSU' || inputs.ksu_variant == 'ReSukiSU' || inputs.ksu_variant == 'Next')
        run: |
          TARGET_PATH="$KERNEL_ROOT/common/out/arch/arm64/boot"

          cp -r $SUKISU_PATCHES/kpm/patch_linux "$TARGET_PATH/patch"
          cd "$TARGET_PATH"
          chmod 777 patch
          ./patch
          rm -rf Image
          mv oImage Image

      # ==================== 准备 Boot 镜像 ====================
      # 复制编译产物到工作目录
      - name: 准备 Boot 镜像
        run: |
          mkdir -p bootimgs

          SRC_DIR="$KERNEL_ROOT/common/out/arch/arm64/boot"

          cp "$SRC_DIR/Image" ./bootimgs/
          [ -f "$SRC_DIR/Image.lz4" ] && cp "$SRC_DIR/Image.lz4" ./bootimgs/
          cp "$SRC_DIR/Image" ./
          [ -f "$SRC_DIR/Image.lz4" ] && cp "$SRC_DIR/Image.lz4" ./
          gzip -n -k -f -9 ./Image > ./Image.gz

      # ==================== 创建 AnyKernel3 压缩包 ====================
      - name: 创建 AnyKernel3 压缩包
        run: |
          cd $ANYKERNEL3
          #ZIP_NAME="${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          ZIP_NAME="${{ env.KSUVER }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-AnyKernel3.zip"
          mv ../Image ./Image
          zip -r "../$ZIP_NAME" ./*

      # ==================== 构建 Boot 镜像 (Android 12) ====================
      # Android 12 需要从 GKI 认证镜像中提取 ramdisk
      - name: 构建 Boot 镜像 (Android 12)
        if: inputs.android_version == 'android12'
        working-directory: bootimgs
        run: |
          GKI_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-${{ inputs.os_patch_level }}_${{ inputs.revision }}.zip
          FALLBACK_URL=https://dl.google.com/android/gki/gki-certified-boot-android12-5.10-2023-01_r1.zip

          status=$(curl -sL -w "%{http_code}" "$GKI_URL" -o /dev/null)
          if [ "$status" = "200" ]; then
            curl -Lo gki-kernel.zip "$GKI_URL"
          else
            curl -Lo gki-kernel.zip "$FALLBACK_URL"
          fi

          unzip gki-kernel.zip && rm gki-kernel.zip
          $UNPACK_BOOTIMG --boot_img="$(pwd)/boot-5.10.img"

          gzip -n -k -f -9 ./Image > ./Image.gz

          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.KSUVER }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img
          
          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.KSUVER }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img
          
          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img --ramdisk out/ramdisk --os_version 12.0.0 --os_patch_level "${{ inputs.os_patch_level }}"
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ env.KSUVER }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      # ==================== 构建 Boot 镜像 (Android 13+) ====================
      # Android 13 及以上版本不需要 ramdisk
      - name: 构建 Boot 镜像 (Android 13+)
        if: inputs.android_version == 'android13' || inputs.android_version == 'android14' || inputs.android_version == 'android15'
        working-directory: bootimgs
        run: |
          gzip -n -k -f -9 ./Image > ./Image.gz

          echo "Building boot.img"
          $MKBOOTIMG --header_version 4 --kernel Image --output boot.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot.img ../${{ env.KSUVER }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot.img

          echo "Building boot-gz.img"
          $MKBOOTIMG --header_version 4 --kernel Image.gz --output boot-gz.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-gz.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-gz.img ../${{ env.KSUVER }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-gz.img

          echo "Building boot-lz4.img"
          $MKBOOTIMG --header_version 4 --kernel Image.lz4 --output boot-lz4.img
          $AVBTOOL add_hash_footer --partition_name boot --partition_size $((64 * 1024 * 1024)) --image boot-lz4.img --algorithm SHA256_RSA2048 --key $BOOT_SIGN_KEY_PATH
          cp ./boot-lz4.img ../${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}-boot-lz4.img

      # ==================== 收集补丁冲突文件 ====================
      # 收集所有 .rej 文件用于调试补丁失败问题
      - name: 收集补丁冲突文件
        if: always()
        run: |
          REJECTS_DIR="$GITHUB_WORKSPACE/patch-rejects"
          mkdir -p "$REJECTS_DIR"

          mapfile -t REJS < <(find "$KERNEL_ROOT" -type f -name '*.rej')
          REJ_COUNT=${#REJS[@]}
          echo "发现 $REJ_COUNT 个 .rej 文件"
          echo "REJ_COUNT=$REJ_COUNT" >> $GITHUB_ENV

          if [ "$REJ_COUNT" -gt 0 ]; then
            for REJ in "${REJS[@]}"; do
              REL="${REJ#"$KERNEL_ROOT"/}"
              DEST="$REJECTS_DIR/$REL"
              mkdir -p "$(dirname "$DEST")"
              cp "$REJ" "$DEST"

              ORIG="${REJ%.rej}"
              if [ -f "$ORIG" ]; then
                cp "$ORIG" "${DEST%.rej}"
              fi
              echo "$REL" >> "$REJECTS_DIR/index.txt"
            done
          fi

      # ==================== 上传构建产物 ====================
      - name: 上传构建产物
        if: ${{ !inputs.onlyAk3 }}
        uses: actions/upload-artifact@v4
        with:
          #name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}
          name: ${{ inputs.kernelsu_variant }}(${{ env.KSUVER }})_kernel-${{ env.CONFIG }}
          path: |
            *AnyKernel3.zip
            *.img
          compression-level: 9

      - name: 上传编译资产 (仅 AK3)
        if: ${{ inputs.onlyAk3 }}
        uses: actions/upload-artifact@v4
        with:
          #name: ${{ inputs.kernelsu_variant }}(${{ env.KSUVER }})-${{ env.CONFIG }}-Anykernel3
          name: ${{ env.KSUVER }}-${{ env.CONFIG }}-Anykernel3
          path: ./AnyKernel3/*

      # ==================== 上传补丁冲突文件 ====================
#      - name: 上传补丁冲突文件
#        if: always() && env.REJ_COUNT > 0
#        uses: actions/upload-artifact@v4
#        with:
#          name: ${{ inputs.ksu_variant }}_kernel-${{ env.CONFIG }}-Rejects
#          path: patch-rejects/
#          if-no-files-found: ignore
#          compression-level: 9
